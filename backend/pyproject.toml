[project]
name = "stellardeps"
version = "0.1.0"
description = "Stateless dependency-graph engine and API for the Stellardeps galaxy explorer"
readme = "../README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "networkx>=3.3",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.7.0",
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stellardeps"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
